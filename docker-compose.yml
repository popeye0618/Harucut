services:
  mysql:
    image: mysql:8.0
    container_name: harucut-mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root1234!
      MYSQL_DATABASE: harucut
      MYSQL_USER: harucut
      MYSQL_PASSWORD: harucut!!
      TZ: Asia/Seoul
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - harucut-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot1234!"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: harucut-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    container_name: harucut-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"   # SMTP — application.yaml의 MAIL_PORT 기본값과 일치
      - "8025:8025"   # Web UI

volumes:
  harucut-mysql-data:
