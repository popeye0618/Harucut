# 하루컷 부하 테스트용 Prometheus 설정
#
# 수집 대상은 앱의 관리 포트(8081)에 있는 /actuator/prometheus 하나다.
# API 포트(8080)가 아니다. 관리 포트는 호스트로 공개하지 않으므로
# 같은 도커 네트워크 안에서만 닿는다.

global:
  # 부하 테스트는 몇 분 단위로 끝난다. 기본값 1분으로 두면
  # 한 구간에 점이 서너 개밖에 안 찍혀 그래프가 계단처럼 보인다.
  scrape_interval: 5s
  evaluation_interval: 15s
  external_labels:
    project: harucut

scrape_configs:
  - job_name: harucut-app
    metrics_path: /actuator/prometheus
    static_configs:
      # 측정용 앱 컨테이너의 서비스 이름이다(docker-compose.measure.yml).
      # 앱을 IDE 에서 직접 띄워 재는 경우에는 host.docker.internal:8081 로 바꾼다.
      # 둘 다 적어 두면 안 쓰는 쪽이 항상 DOWN 으로 남아 화면이 지저분해진다.
      - targets:
          - app:8081

  - job_name: prometheus
    # Prometheus 자신. 수집이 밀리고 있는지 확인할 때만 쓴다.
    static_configs:
      - targets:
          - localhost:9090
