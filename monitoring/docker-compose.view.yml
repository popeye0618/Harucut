# 측정 결과를 눈으로 확인하기 위한 관측 스택.
#
# 루트의 docker-compose.yml 에도 prometheus/grafana 가 있지만 그쪽은 부하 테스트 프로파일이고
# 포트가 9090/3001 이다. 이 PC 에서는 다른 프로젝트가 그 포트를 이미 쓰고 있어 충돌한다.
# 그래서 조회 전용으로 포트만 다르게 띄운다.
#
#   실행:  docker compose -f monitoring/docker-compose.view.yml up -d
#   종료:  docker compose -f monitoring/docker-compose.view.yml down
#
#   Grafana     http://localhost:3002
#   Prometheus  http://localhost:9091
#
# name 을 harucut 으로 고정하는 이유:
# 루트 스택과 같은 프로젝트 이름이어야 볼륨(harucut_harucut-prometheus-data)을 공유한다.
# 이름이 다르면 빈 볼륨이 새로 만들어져서 예전 측정 데이터가 안 보인다.
name: harucut

services:
  prometheus:
    image: prom/prometheus:latest
    container_name: harucut-prometheus
    restart: unless-stopped
    ports:
      - "9091:9090"
    volumes:
      - ../monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - harucut-prometheus-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      # 루트 compose 는 7d 다. 포트폴리오용으로 남겨야 하므로 여기서는 90d 로 잡는다.
      # 측정한 지 7일이 지나면 데이터가 지워지기 때문이다.
      - --storage.tsdb.retention.time=90d
      # 스냅샷 API 를 열어 둔다. 측정 직후 스냅샷을 뜨면 보존 기간과 무관하게 남길 수 있다.
      - --web.enable-admin-api
    extra_hosts:
      # 앱을 IDE 에서 직접 실행했을 때 컨테이너에서 호스트로 닿기 위한 설정.
      - "host.docker.internal:host-gateway"

  grafana:
    image: grafana/grafana:latest
    container_name: harucut-grafana
    restart: unless-stopped
    ports:
      - "3002:3000"
    environment:
      # 로컬 조회 전용이라 로그인을 생략한다. 외부에 노출되는 곳에서는 쓰면 안 된다.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      # 열자마자 합성 파이프라인 대시보드가 뜨게 한다.
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/provisioning/dashboards/harucut-compose.json
    volumes:
      - ../monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - harucut-grafana-data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  # external 로 두지 않는다. 없으면 새로 만들고, 있으면 그대로 붙는다.
  harucut-prometheus-data:
  harucut-grafana-data:
