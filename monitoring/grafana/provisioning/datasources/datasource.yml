# Grafana 가 뜰 때 데이터소스를 자동으로 등록한다.
# 컨테이너를 지웠다 다시 만들어도 손으로 붙일 필요가 없다.

apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    # 대시보드 JSON 이 이 uid 로 데이터소스를 가리킨다. 바꾸면 대시보드도 같이 고쳐야 한다.
    uid: harucut-prom
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      # prometheus.yml 의 scrape_interval 과 맞춘다.
      # 이 값보다 짧은 구간을 조회하면 빈 그래프가 나온다.
      timeInterval: 5s
