spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/harucut?characterEncoding=UTF-8&serverTimezone=Asia/Seoul}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: true
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}

cookie:
  secure: false
