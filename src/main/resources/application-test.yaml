spring:
  datasource:
    url: jdbc:h2:mem:harucut;MODE=MySQL;NON_KEYWORDS=VALUE
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
  mail:
    host: localhost
    port: 1025
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: test-google-client-id
            client-secret: test-google-client-secret
          kakao:
            client-id: test-kakao-client-id
            client-secret: test-kakao-client-secret
          naver:
            client-id: test-naver-client-id
            client-secret: test-naver-client-secret

jwt:
  secret: local-dev-secret-key-must-be-at-least-256-bits-for-hs256-algorithm-x

cookie:
  secure: false

cloud:
  aws:
    s3:
      bucket: harucut-test