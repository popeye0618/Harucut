spring:
  datasource:
    url: jdbc:h2:mem:harucut;MODE=MySQL;NON_KEYWORDS=VALUE
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
  mail:
    host: localhost
    port: 1025
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: test-google-client-id
            client-secret: test-google-client-secret
          kakao:
            client-id: test-kakao-client-id
            client-secret: test-kakao-client-secret
          naver:
            client-id: test-naver-client-id
            client-secret: test-naver-client-secret

jwt:
  secret: local-dev-secret-key-must-be-at-least-256-bits-for-hs256-algorithm-x

cookie:
  secure: false

compose:
  result-consumer:
    # 켜두면 테스트가 실제 SQS 를 긁는다
    enabled: false

cloud:
  aws:
    s3:
      bucket: harucut-test
    lambda:
      # 테스트는 합성을 부르지 않는다. 생성자가 빈 값이면 죽어서 넣는 자리표시자다
      compose-function: test-compose-function
    sqs:
      compose-result-queue-url: ""