spring:
  profiles:
    default: local
  jackson:
    time-zone: Asia/Seoul
    default-property-inclusion: non_null
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_STARTTLS:false}
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - openid
              - email
              - profile
          kakao:
            client-id: ${KAKAO_CLIENT_ID}
            client-secret: ${KAKAO_CLIENT_SECRET}
            client-name: kakao
            redirect-uri: "{baseUrl}/login/oauth2/code/kakao"
            authorization-grant-type: authorization_code
            client-authentication-method: client_secret_post
            scope:
              - openid
              - account_email
          naver:
            client-id: ${NAVER_CLIENT_ID}
            client-secret: ${NAVER_CLIENT_SECRET}
            client-name: naver
            redirect-uri: "{baseUrl}/login/oauth2/code/naver"
            authorization-grant-type: authorization_code
            client-authentication-method: client_secret_post
            scope:
              - name
              - email
              - profile_image
        provider:
          kakao:
            issuer-uri: https://kauth.kakao.com
            user-name-attribute: sub
          naver:
            authorization-uri: https://nid.naver.com/oauth2.0/authorize
            token-uri: https://nid.naver.com/oauth2.0/token
            user-info-uri: https://openapi.naver.com/v1/nid/me
            user-name-attribute: response

  batch:
    job:
      enabled: false


kakao:
  auth:
    # 탈퇴 배치의 연결 끊기(unlink)에 쓴다. 로그인용 client-secret과 다른 키다.
    admin-key: ${KAKAO_ADMIN_KEY:}

jwt:
  secret: ${JWT_SECRET_KEY}
  access-expiration: 30m
  refresh-expiration: 14d

cookie:
  domain: ${COOKIE_DOMAIN:localhost}
  secure: ${COOKIE_SECURE:true}
  same-site: ${COOKIE_SAME_SITE:Lax}

mail:
  from: ${MAIL_FROM:no-reply@harucut.com}

frontend:
  url: ${FRONTEND_URL:http://localhost:5173}

cloud:
  aws:
    region: ${AWS_REGION:ap-northeast-2}
    s3:
      bucket: ${S3_BUCKET}
    lambda:
      # compose.executor=lambda일 때만 필요 — 로컬(기본 in-process)은 비워둔다
      compose-function: ${COMPOSE_LAMBDA_FUNCTION:}

payment:
  gateway:
    provider: ${PAYMENT_GATEWAY_PROVIDER:mock}
  mock:
    fail-charge: false
  grace-days: ${PAYMENT_GRACE_DAYS:3}
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    # 엔드포인트가 60개가 넘는다. 다 펼쳐 놓으면 찾기가 더 어렵다.
    doc-expansion: none
    # tags-sorter 를 두지 않는다. OpenApiConfig.tags() 에 적은 순서가 그대로 표시 순서가 된다.
    operations-sorter: method
    display-request-duration: true
    # 처음 열었을 때 선택돼 있을 그룹. 그룹 id(1-user)가 아니라 displayName 으로 찾는다.
    urls-primary-name: 사용자 API
  api-docs:
    path: /v3/api-docs
